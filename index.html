    <p>Pewnego dnia mały chłopiec o imieniu Tomek znalazł w starej szufladzie dziwną, błyszczącą monetę. Nie wiedział jeszcze, że ta moneta zmieni jego życie na zawsze.</p>
    <p>Moneta była ciepła w dotyku i mieniła się tysiącem kolorów. Kiedy Tomek obrócił ją w dłoni, zobaczył na niej dziwne symbole, których nigdy wcześniej nie widział.</p>
    <p>"Co to może być?" - szepnął do siebie z zachwytem.</p>`,`<p>Wokół niego zaczęły dziać się dziwne rzeczy. Powietrze zawirowało, a z monetki popłynął delikatny, magiczny blask.</p>

    <p>Nagle świat wokół niego zaczął się zmieniać. Kolory stały się bardziej intensywne, a dźwięki wyraźniejsze.</p>
    <p>Moneta w jego dłoni zaczęła świecić coraz jaśniej, aż w końcu otworzyła się w nim mała szczelina prowadząca do innego wymiaru.</p>`,`<h2 style="font-size:1.5em;font-weight:bold;margin-bottom:1em;color:#8B4513">Rozdział 2: Magiczna kraina</h2>
    <p>Kiedy Tomasz otworzył oczy, znalazł się w zupełnie innym miejscu. Nie był już w swoim pokoju - stał na środku wielkiego lasu, pełnego dziwnych, kolorowych roślin.</p>
    <p>Drzewa były tak wysokie, że sięgały chmur. Ich pnie świeciły delikatnym, niebieskim światłem, a między gałęziami latały maleńkie istoty przypominające miniaturowe smoki.</p>`,`<p>"Gdzie ja jestem?" - zapytał Tomasz z zdumieniem, ale nie był przerażony. Raczej podekscytowany nową sytuacją.</p>
    <p>Za pierwszym krzakiem usłyszał delikatny szept. Obrócił się i zobaczył małą, lśniącą postać. Wyglądała jak miniaturowa wróżka ze skrzydłami z kolorowych liści.</p>
    <p>"Witaj, młody podróżniku" - powiedziała postać ciepłym głosem. "Witamy w krainie Everwood."</p>`,`<h2 style="font-size:1.5em;font-weight:bold;margin-bottom:1em;color:#8B4513">Rozdział 3: Nowi przyjaciele</h2>
    <p>Wróżka przedstawiła się jako Lumina. Opowiedziała Tomkowi o krainie Everwood - świecie, który istniał równolegle do naszego.</p>
    <p>"Ta moneta, którą znalazłeś" - powiedziała Lumina - "to klucz do naszego świata. Wybrała ciebie, bo masz dobre serce."</p>
    <p>Tomek nie do końca rozumiał, co się dzieje, ale czuł, że to początek czegoś wyjątkowego.</p>`,`<p>Nagle usłyszeli głośny trzask. Z krzaków wyskoczył mały, futrzasty stworek o trzech nogach i wielkich, błyszczących oczach.</p>
    <p>"To jest Fluffik" - przedstawiła go Lumina. "Jeden z opiekunów lasu. Jest trochę niezdarny, ale ma złote serce."</p>
